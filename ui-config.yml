---
type: showroom

# Set the left content column width to 40%
default_width: 40
# Persist the URL state so browser refresh doesn't reset the UI
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:
  - name: Terminal
    path: /wetty
    port: 443
  # These UIs send X-Frame-Options / frame-ancestors that block Showroom iframes.
  # external: true opens them in a new browser tab instead.
  - name: OpenShift Console
    url: 'https://console-openshift-console.${DOMAIN}'
    external: true
  - name: Red Hat Advanced Cluster Security
    url: 'https://central-acs.${DOMAIN}'
    external: true
  - name: OpenShift GitOps
    url: 'https://openshift-gitops-server-openshift-gitops.${DOMAIN}'
    external: true
