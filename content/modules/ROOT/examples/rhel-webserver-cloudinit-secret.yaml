apiVersion: v1
kind: Secret
metadata:
  name: rhel-webserver-cloudinit
  namespace: acs-virt
type: Opaque
stringData:
  userdata: |
    #cloud-config
    user: cloud-user
    password: redhat
    chpasswd: { expire: false }
    runcmd:
      - curl -k -o /tmp/katello-ca-consumer-latest.noarch.rpm https://demosat-ha.infra.demo.redhat.com/pub/katello-ca-consumer-latest.noarch.rpm
      - rpm -Uvh /tmp/katello-ca-consumer-latest.noarch.rpm
      - |
        subscription-manager register \
          --activationkey="demosat-smt-lb1161-wolfgang" \
          --org="Red_Hat_RHDP_Labs" \
          --name="rhel-webserver" \
          --force
      - subscription-manager release --set=9.6
      - |
        subscription-manager repos \
          --enable=rhel-9-for-x86_64-baseos-eus-rpms \
          --enable=rhel-9-for-x86_64-appstream-eus-rpms
      - dnf clean all
      - dnf update -y
      - |
        dnf install -y \
          httpd curl wget openssl openssl-libs zlib libxml2 \
          ghostscript perl nginx tar gzip nmap-ncat bzip2 zip unzip \
          freetype libjpeg-turbo libtiff libpng gnutls \
          java-17-openjdk python3 python3-pip git php \
          postgresql nodejs 2>/dev/null || true
      - curl -L -f -o /tmp/roxagent https://mirror.openshift.com/pub/rhacs/assets/4.10.0/bin/linux/roxagent
      - chmod +x /tmp/roxagent
      - mv /tmp/roxagent /usr/local/bin/roxagent
      - restorecon -v /usr/local/bin/roxagent
      - |
        # Start roxagent in server mode (VSOCK pull) so Sensor can request package inventory
        nohup /usr/local/bin/roxagent serve --port 818 >/var/log/roxagent.log 2>&1 &
      - echo "Setup complete"
